<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>My Photo Gallery</h1>

  <main class="gallery">

    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Mountain">
      <p>Mountain Morning</p>
    </div>

    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Beach">
      <p>Ocean Breeze</p>
    </div>

    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Landscape">
      <p>Quiet Valley</p>
    </div>

    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" alt="Forest">
      <p>Into the Woods</p>
    </div>

    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1494783367193-149034c05e8f?auto=format&fit=crop&w=800&q=80" alt="Road">
      <p>Open Road</p>
    </div>

    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?auto=format&fit=crop&w=800&q=80" alt="Sunset">
      <p>Golden Hour</p>
    </div>

  </main>

</body>
</html>
